<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>

<body>
<div class="all-content">
    <header>
        <div class="heading-content">
            <img class="food-logo" src="/images/foodie hamburger logo.png" alt="">
            <div class="hamburger-menu-container">
                <div class="hamburger-menu">
                    <span class="hamburger-icon">&#9776;</span>
                </div>
            </div>
            <nav>
                <span class="close-items">&times;</span>
                <a href="#Top Picks">Top Picks</a>
                <a href="#Whopper">Whopper</a>
                <a href="#Stunner Menu">Stunner Menu</a>
                <a href="#New Foodie Collection">New Foodie Collection</a>
                <a href="#Deal of the Day">Deal of the Day</a>
            </nav>

        </div>
    </header>
    <main>
        <section class="hero-section">
            <div class="first-1">
                <img src="/images/Group 2.png" alt="">
            </div>
            <p class="hero-content">Well, You can’t resist anymore!</p>
        </section>
    </main>
    <div id="Top Picks" class="menu">
        <div class="items">
            <p class="name">Top Picks</p>
        </div>
        <img src="/images/2.png" alt="">
    </div>
    <div id="Whopper" class="menu">
        <div class="items">
            <p class="name">Whopper</p>
        </div>
        <img src="/images/3.png" alt="">
    </div>
    <div id="Stunner Menu" class="menu">
        <div class="items">
            <p class="name">Stunner Menu</p>
        </div>
        <img src="/images/4.png" alt="">
    </div>
    <div id="New Foodie Collection" class="menu">
        <div class="items">
            <p class="name">New Foodie Collection</p>
        </div>
        <img src="/images/5.png" alt="">
    </div>
    <div id="Deal of the Day" class="menu">
        <div class="items">
            <p class="name">Deal of the Day</p>
        </div>
        <img src="/images/6.png" alt="">
    </div>
    <div class="top">
        <a href="#">Go to Top </a>
    </div>

    <div class="final">
        <p>Made with ❤️ by Parvej Khan</p>
    </div>
</div>
</body>

</html>
